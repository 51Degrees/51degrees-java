name: Cloud Human Confidence Tests

# Runs the Human Confidence web example's live tests
# (examples/device-detection/web/human-confidence, HumanConfidenceLiveTest)
# once, against the staging cloud, because the production cloud does not
# serve HumanConfidenceSource yet. Each test reads its own resource key under
# the key's own name. The Bespoke key's products offer HumanConfidenceSource,
# so its answer carries Passive and a level. The Basic key's products don't,
# so the cloud answers its source as null, with the reason.
#
# CLOUD_STAGING_ENDPOINT, the staging cloud's API base, is an organization
# variable that only CI uses. RESOURCE_KEY_BESPOKE_STAGING is a Bespoke key
# the staging cloud resolves, and _51DEGREES_RESOURCE_KEY_BASIC resolves on
# both clouds. Both keys are organization secrets. A new key needs a line
# here and in the test, as well as the organization secret.
#
# The run fails when a name is empty or when a test is skipped. A cloud test
# that passes without calling the cloud reports success having proved
# nothing, and that is worse than a red job.

on:
  workflow_dispatch:
  # Nightly as well, so a change in what the service answers is found the
  # next morning rather than by a customer.
  schedule:
    - cron: '20 6 * * *'
  pull_request:
    branches: [main, rc]
    paths:
      - 'examples/device-detection/web/human-confidence/**'
      - '.github/workflows/cloud-human-confidence.yml'

permissions:
  contents: read

# Every compiler and tool warning is an error in the builds 51Degrees runs.
# The poms and the native CMake files read this variable.
env:
  _51DEGREES_WARNINGS_AS_ERRORS: 'true'

jobs:
  cloud-human-confidence:
    name: Cloud Human Confidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Human Confidence tests
        shell: pwsh
        working-directory: examples/device-detection
        env:
          RESOURCE_KEY_BESPOKE_STAGING: ${{ secrets.RESOURCE_KEY_BESPOKE_STAGING }}
          _51DEGREES_RESOURCE_KEY_BASIC: ${{ secrets._51DEGREES_RESOURCE_KEY_BASIC }}
          CLOUD_STAGING_ENDPOINT: ${{ vars.CLOUD_STAGING_ENDPOINT }}
        run: |
          # Each test skips without its key or the endpoint, so a missing one
          # fails here, naming every organization secret or variable missing.
          $missing = @(
            'RESOURCE_KEY_BESPOKE_STAGING'
            '_51DEGREES_RESOURCE_KEY_BASIC'
            'CLOUD_STAGING_ENDPOINT'
          ) | Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
            throw ("The organization secret or variable " +
              "$($missing -join ', ') is empty or missing, so the live " +
              'tests cannot run.')
          }
          $report = 'web/human-confidence/target/surefire-reports/' +
            'TEST-fiftyone.devicedetection.examples.web.HumanConfidenceLiveTest.xml'
          Remove-Item $report -ErrorAction SilentlyContinue
          mvn -B --no-transfer-progress -pl web/human-confidence -am test `
            '-Dtest=HumanConfidenceLiveTest' `
            '-Dsurefire.failIfNoSpecifiedTests=false'
          if ($LASTEXITCODE -ne 0) {
            throw 'The live tests failed.'
          }
          if (-not (Test-Path $report)) {
            throw 'The live tests did not run.'
          }
          $suite = ([xml](Get-Content -Raw $report)).testsuite
          if ([int]$suite.tests -eq 0 -or [int]$suite.skipped -gt 0) {
            throw ('A live test was skipped, so it proved nothing. ' +
              "$($suite.testcase.skipped.message)")
          }
