name: Cloud Human Confidence Tests

# Runs the Human Confidence web example's live test
# (examples/device-detection/web/human-confidence, HumanConfidenceLiveTest)
# once for each resource key below, against the staging cloud, because the
# production cloud does not serve HumanConfidenceSource yet. Each pass sets
# the single _51DEGREES_RESOURCE_KEY the example reads, and tells the test
# with -DhumanConfidenceSource what that key's answer carries. The Bespoke
# key's products offer HumanConfidenceSource, so its answer carries Passive.
# The Basic key's products don't, so its answer carries no source.
#
# CLOUD_STAGING_ENDPOINT, the staging cloud's API base, is an organization
# variable that only CI uses. RESOURCE_KEY_BESPOKE_STAGING is a Bespoke key
# the staging cloud resolves, and _51DEGREES_RESOURCE_KEY_BASIC resolves on
# both clouds. Both keys are organization secrets. A new key needs a line
# here as well as the organization secret.
#
# A pass fails when its key or the endpoint is empty, or when the test is
# skipped. A cloud test that passes without calling the cloud reports
# success having proved nothing, and that is worse than a red job.

on:
  workflow_dispatch:
  # Nightly as well, so a change in what the service answers is found the
  # next morning rather than by a customer.
  schedule:
    - cron: '20 6 * * *'
  pull_request:
    branches: [main, rc]
    paths:
      - 'examples/device-detection/web/human-confidence/**'
      - '.github/workflows/cloud-human-confidence.yml'

permissions:
  contents: read

jobs:
  cloud-human-confidence:
    name: Cloud Human Confidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Human Confidence test for each resource key
        shell: pwsh
        working-directory: examples/device-detection
        env:
          RESOURCE_KEY_BESPOKE_STAGING: ${{ secrets.RESOURCE_KEY_BESPOKE_STAGING }}
          _51DEGREES_RESOURCE_KEY_BASIC: ${{ secrets._51DEGREES_RESOURCE_KEY_BASIC }}
          CLOUD_STAGING_ENDPOINT: ${{ vars.CLOUD_STAGING_ENDPOINT }}
        run: |
          if (-not $env:CLOUD_STAGING_ENDPOINT) {
            Write-Host ('::error::The organization variable ' +
              'CLOUD_STAGING_ENDPOINT is empty or missing, so the live ' +
              'test has no cloud to call.')
            exit 1
          }
          # Each key, with the source its answer carries.
          $passes = [ordered]@{
            RESOURCE_KEY_BESPOKE_STAGING = 'Passive'
            _51DEGREES_RESOURCE_KEY_BASIC = 'none'
          }
          $report = 'web/human-confidence/target/surefire-reports/' +
            'TEST-fiftyone.devicedetection.examples.web.HumanConfidenceLiveTest.xml'
          $failed = $false
          foreach ($name in $passes.Keys) {
            Write-Host "::group::Live test with $name"
            $key = [Environment]::GetEnvironmentVariable($name)
            if (-not $key) {
              Write-Host ("::error::The organization secret $name is " +
                'empty or missing, so the live test cannot run with it.')
              $failed = $true
              Write-Host '::endgroup::'
              continue
            }
            $env:_51DEGREES_RESOURCE_KEY = $key
            Remove-Item $report -ErrorAction SilentlyContinue
            mvn -B --no-transfer-progress -pl web/human-confidence -am test `
              '-Dtest=HumanConfidenceLiveTest' `
              '-Dsurefire.failIfNoSpecifiedTests=false' `
              "-DhumanConfidenceSource=$($passes[$name])"
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
            } elseif (-not (Test-Path $report)) {
              Write-Host "::error::The live test with $name did not run."
              $failed = $true
            } else {
              $suite = ([xml](Get-Content -Raw $report)).testsuite
              if ([int]$suite.tests -eq 0 -or [int]$suite.skipped -gt 0) {
                Write-Host ("::error::The live test with $name was " +
                  "skipped, so it proved nothing. " +
                  "$($suite.testcase.skipped.message)")
                $failed = $true
              }
            }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
