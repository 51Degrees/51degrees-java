name: Temporary web integration tests

on:
  push:
    branches:
      - 'tmp/gaps-java-web-**'

permissions:
  contents: read

jobs:
  test:
    name: Web integration tests, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['8', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the submodules the modules build from
        shell: pwsh
        run: |
          git submodule update --init pipeline/pipeline.javascriptbuilder/src/main/resources/fiftyone/pipeline/javascriptbuilder/templates pipeline/owid-java
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - name: Run the web integration tests
        shell: pwsh
        run: |
          git log --oneline -1
          mvn -B -f pipeline/pom.xml -pl pipeline.engines.fiftyone,pipeline.web.packages/pipeline.web,pipeline.web.packages/pipeline.web.mvc -am test `
            '-Dtest=SequenceElementTests,FiftyOneJSServiceCoreTests,PipelineFilterTests,FiftyOneInterceptorTests,ClientsidePropertyServiceTests' `
            '-Dmaven.test.failure.ignore=true' '-Dmaven.test.failure.ignore=true' '-DfailIfNoTests=false' '-Dsurefire.failIfNoSpecifiedTests=false'
          if ($LASTEXITCODE -ne 0) { exit 1 }
