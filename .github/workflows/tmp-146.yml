name: tmp data update check failures
on:
  push:
    branches:
      - 'tmp/java-146-win-red'
      - 'tmp/java-146-win-green'
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch the pipeline submodules
        run: git submodule update --init --depth 1 pipeline/owid-java pipeline/pipeline.core/configuration-validation pipeline/pipeline.javascriptbuilder/src/main/resources/fiftyone/pipeline/javascriptbuilder/templates
      - name: Run the data update tests
        shell: bash
        run: >
          mvn -B --no-transfer-progress -Pdev
          -pl pipeline/pipeline.engines -am test
          -Dtest=DataUpdateServiceCheckFailureTests,DataUpdateServiceWatchedFileTests,DataUpdateServiceTests
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dmaven.test.failure.ignore=true
      - name: List the test results
        if: always()
        shell: bash
        run: |
          git log --oneline -3
          for f in $(find . -path '*surefire-reports*' -name 'TEST-*.xml'); do
            grep -o '<testsuite [^>]*' "$f" | grep -o -E '(name|tests|failures|errors|skipped)="[^"]*"' | tr '\n' ' '; echo
          done
          files=$(grep -l -E '<(failure|error)[ >]' -r --include='TEST-*.xml' . || true)
          if [ -n "$files" ]; then
            for f in $files; do
              echo "== $f"
              grep -A6 -E '<(failure|error)[ >]' "$f" | cut -c1-300 | head -24
            done
            exit 1
          fi
          echo "No failing tests"
