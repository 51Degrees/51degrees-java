name: Temporary old environment name tests

on:
  push:
    branches:
      - 'tmp/endpoint-java-**'

permissions:
  contents: read

jobs:
  test:
    name: Old environment name tests, ${{ matrix.os }} java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['8', '17']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the submodules without their large files
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git submodule update --init --recursive --depth 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - name: Build everything as the full build does
        shell: pwsh
        run: |
          git log --oneline -3
          mvn install --batch-mode --no-transfer-progress -q '-DskipTests' '-Pdev'
          if ($LASTEXITCODE -ne 0) { Write-Output 'The build failed.'; exit 1 }
      - name: Run the old environment name tests in every module
        shell: pwsh
        run: |
          $tests = @(
            'fiftyone.pipeline.cloudrequestengine.flowelements.CloudRequestEngineBuilderTests'
            'fiftyone.pipeline.did.DidClientEnvironmentTests'
            'fiftyone.pipeline.did.LiveCloudKeysTests'
            'pipeline.developerexamples.cloudengine.EndpointTests'
            'pipeline.developerexamples.fodid.DeprecatedKeyNameTests'
            'fiftyone.ipintelligence.shared.testhelpers.FileUtilsTest'
            'fiftyone.ipintelligence.shared.testhelpers.KeyUtilsTest'
            'fiftyone.ipintelligence.examples.shared.DataFileHelperTest'
            'fiftyone.ipintelligence.examples.shared.KeyHelperTest'
            'fiftyone.devicedetection.examples.web.OnPremDataFileOptionTest'
          ) -join ','
          mvn test --batch-mode --no-transfer-progress '-Pdev' "-Dtest=$tests" `
            '-DfailIfNoTests=false' '-Dsurefire.failIfNoSpecifiedTests=false' `
            '-Dmaven.test.failure.ignore=true' 2>&1 | Tee-Object -FilePath test.log |
            Select-String -Pattern 'Tests run:|FAIL|expected|Exception|BUILD|ERROR\]   ' |
            ForEach-Object { $_.Line }
          $classes = @(Select-String -Path test.log -Pattern 'Tests run: \d+, Failures: (\d+), Errors: (\d+), Skipped: \d+, Time elapsed')
          $bad = @($classes | Where-Object {
            $_.Matches[0].Groups[1].Value -ne '0' -or $_.Matches[0].Groups[2].Value -ne '0' })
          Write-Output "Test classes run: $($classes.Count). Test classes with a failure or an error: $($bad.Count)."
          if ($classes.Count -lt 10) { Write-Output 'Fewer than the ten test classes ran.'; exit 1 }
          if ($bad.Count -ne 0) { exit 1 }
