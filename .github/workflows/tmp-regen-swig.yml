# Temporary. Generates the SWIG wrappers for 51degrees-cxx 4.5.101 and is
# removed from the branch once they are committed.
name: Temporary SWIG wrapper generation

on:
  push:
    branches:
      - 'feature/cxx-4.5.101'

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  SWIG_TAG: v4.5.1
  SWIG_TAG_COMMIT: 88649f559942c29a228fa783dd01581e217bcb20
  CXX_COMMITTED: 4110d6813e167a803a06489318b33b83a230fa32
  CXX_TARGET: 4e023aaa5c1f5ec56d475c75a91761d8ef55dc20
  DD_CXX: device-detection/device-detection.hash.engine.on-premise/src/main/cxx
  DD_SWIG: device-detection/device-detection.hash.engine.on-premise/src/main/java/fiftyone/devicedetection/hash/engine/onpremise/interop/swig
  IPI_CXX: ip-intelligence/ip-intelligence.engine.on-premise/src/main/cxx
  IPI_SWIG: ip-intelligence/ip-intelligence.engine.on-premise/src/main/java/fiftyone/ipintelligence/engine/onpremise/interop/swig

jobs:
  Generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with submodules
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Build SWIG 4.5.1 from its tag
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison libpcre2-dev
          git clone --depth 1 --branch "$SWIG_TAG" https://github.com/swig/swig.git "$RUNNER_TEMP/swig-src"
          actual="$(git -C "$RUNNER_TEMP/swig-src" rev-parse HEAD)"
          echo "SWIG tag $SWIG_TAG is commit $actual"
          test "$actual" = "$SWIG_TAG_COMMIT"
          cd "$RUNNER_TEMP/swig-src"
          ./autogen.sh
          ./configure --prefix="$RUNNER_TEMP/swig"
          make -j"$(nproc)"
          make install
          echo "SWIG_EXE=$RUNNER_TEMP/swig/bin/swig" >> "$GITHUB_ENV"

      - name: Print the SWIG version
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          echo "Using $SWIG_EXE"
          "$SWIG_EXE" -version | tee "$RUNNER_TEMP/out/swig-version.txt"
          grep -q "SWIG Version 4.5.1" "$RUNNER_TEMP/out/swig-version.txt"

      - name: Generate with cxx at 4110d681 into a separate folder and compare
        id: reproduce
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/out"
          GEN="$OUT/generated-4110d681"
          cxx_head="$(git -C "$ROOT/cxx" rev-parse HEAD)"
          echo "cxx is at $cxx_head"
          test "$cxx_head" = "$CXX_COMMITTED"
          mkdir -p "$GEN/$DD_CXX" "$GEN/$DD_SWIG" "$GEN/$IPI_CXX" "$GEN/$IPI_SWIG"

          # Device Detection, the RebuildSwig command in its CMakeLists.txt,
          # with only the output folder changed.
          set -x
          "$SWIG_EXE" -c++ -java -I"$ROOT" -package fiftyone.devicedetection.hash.engine.onpremise.interop.swig -outdir "$GEN/$DD_SWIG" -o "$GEN/$DD_CXX/Java_Hash_Engine.cpp" "$ROOT/$DD_CXX/hash_java.i"
          set +x

          # IP Intelligence, the command in RegenSwig.ps1 run from its folder,
          # with only the output folder changed.
          cd "$ROOT/$IPI_CXX"
          set -x
          "$SWIG_EXE" -c++ -java "-I../../../../.." -package fiftyone.ipintelligence.engine.onpremise.interop.swig -module IpIntelligenceOnPremiseEngineModule -outdir "$GEN/$IPI_SWIG" -o "$GEN/$IPI_CXX/Java_Ipi_Engine.cpp" hash_java.i
          set +x
          cd "$ROOT"

          # Compare every output byte for byte, and the sets of files.
          REPORT="$OUT/reproduction-4110d681.txt"
          {
            (cd "$GEN" && find . -type f | sed 's|^\./||' | sort) | while read -r f; do
              if [ ! -f "$ROOT/$f" ]; then echo "only-generated $f"
              elif cmp -s "$GEN/$f" "$ROOT/$f"; then echo "identical $f"
              else echo "different $f"; fi
            done
            for d in "$DD_SWIG" "$IPI_SWIG"; do
              find "$d" -mindepth 1 | sort | while read -r f; do
                [ -f "$GEN/$f" ] || echo "only-committed $f"
              done
            done
          } > "$REPORT"
          cat "$REPORT"
          (cd "$GEN" && find . -type f | sed 's|^\./||' | sort | xargs sha256sum) > "$OUT/generated-4110d681.sha256"
          { echo "$DD_CXX/Java_Hash_Engine.cpp"; echo "$IPI_CXX/Java_Ipi_Engine.cpp"; find "$DD_SWIG" "$IPI_SWIG" -type f; } | sort | xargs sha256sum > "$OUT/committed-4110d681.sha256"
          {
            diff -ru "$GEN/$DD_SWIG" "$ROOT/$DD_SWIG" || true
            diff -u "$GEN/$DD_CXX/Java_Hash_Engine.cpp" "$ROOT/$DD_CXX/Java_Hash_Engine.cpp" || true
            diff -ru "$GEN/$IPI_SWIG" "$ROOT/$IPI_SWIG" || true
            diff -u "$GEN/$IPI_CXX/Java_Ipi_Engine.cpp" "$ROOT/$IPI_CXX/Java_Ipi_Engine.cpp" || true
          } > "$OUT/reproduction-4110d681.diff"

          total="$(wc -l < "$REPORT")"
          same="$(grep -c '^identical ' "$REPORT" || true)"
          if [ "$total" -gt 0 ] && [ "$total" = "$same" ] && cmp -s "$OUT/generated-4110d681.sha256" "$OUT/committed-4110d681.sha256"; then
            identical=true
          else
            identical=false
          fi
          echo "$same of $total files identical, reproduction diff is $(wc -c < "$OUT/reproduction-4110d681.diff") bytes, identical=$identical"
          echo "identical=$identical" >> "$GITHUB_OUTPUT"
          {
            echo "### Reproduction with cxx at $CXX_COMMITTED"
            echo
            echo "$same of $total files byte for byte identical to the committed files. identical=$identical"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the generated folders for files SWIG did not make
        id: check
        run: |
          set -euo pipefail
          GEN="$RUNNER_TEMP/out/generated-4110d681"
          REPORT="$RUNNER_TEMP/out/folder-check.txt"
          for d in "$DD_SWIG" "$IPI_SWIG"; do
            find "$d" -mindepth 1 | sort | while read -r f; do
              if [ -f "$f" ] && [ -f "$GEN/$f" ]; then made=yes; else made=no; fi
              if [ -f "$f" ] && awk 'NR > 3 { exit } /This file was automatically generated by SWIG/ { found = 1 } END { exit !found }' "$f"; then header=yes; else header=no; fi
              echo "made-by-generation=$made swig-header=$header $f"
            done
          done > "$REPORT"
          cat "$REPORT"
          if grep -q -E 'made-by-generation=no|swig-header=no' "$REPORT"; then foreign=true; else foreign=false; fi
          echo "$(wc -l < "$REPORT") files checked, foreign=$foreign"
          echo "foreign=$foreign" >> "$GITHUB_OUTPUT"
          echo "Files SWIG did not make in the interop/swig folders: foreign=$foreign" >> "$GITHUB_STEP_SUMMARY"

      - name: Move cxx to 4e023aaa
        run: |
          set -euo pipefail
          git -C cxx fetch --depth=1 origin "$CXX_TARGET"
          git -C cxx checkout --detach "$CXX_TARGET"
          test "$(git -C cxx rev-parse HEAD)" = "$CXX_TARGET"
          git -C cxx log -1 --format='cxx is at %H %s'

      - name: Generate in place with cxx at 4e023aaa
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          GEN="$RUNNER_TEMP/out/generated-4110d681"

          # Remove the files the generation makes, as RegenSwig.ps1 does, and
          # nothing else.
          for d in "$DD_SWIG" "$IPI_SWIG"; do
            (cd "$GEN/$d" && find . -maxdepth 1 -type f -name '*.java' | sed 's|^\./||' | sort) | while read -r f; do
              rm -f -v -- "$ROOT/$d/$f"
            done
          done
          rm -f -v -- "$ROOT/$DD_CXX/Java_Hash_Engine.cpp" "$ROOT/$IPI_CXX/Java_Ipi_Engine.cpp"

          # Device Detection, the RebuildSwig command at line 80 of its
          # CMakeLists.txt, with FIFTYONE_ROOT and SRCOUT as that file sets them.
          CMAKE_CURRENT_LIST_DIR="$ROOT/$DD_CXX"
          FIFTYONE_ROOT="$(cd "$CMAKE_CURRENT_LIST_DIR/../../../../.." && pwd)"
          SRCOUT="$CMAKE_CURRENT_LIST_DIR/../java/fiftyone/devicedetection/hash/engine/onpremise"
          set -x
          "$SWIG_EXE" -c++ -java -I"$FIFTYONE_ROOT" -package fiftyone.devicedetection.hash.engine.onpremise.interop.swig -outdir "$SRCOUT/interop/swig" -o "$CMAKE_CURRENT_LIST_DIR/Java_Hash_Engine.cpp" "$CMAKE_CURRENT_LIST_DIR/hash_java.i"
          set +x

          # IP Intelligence, the command in RegenSwig.ps1 run from its folder.
          cd "$ROOT/$IPI_CXX"
          set -x
          "$SWIG_EXE" -c++ -java "-I../../../../.." -package fiftyone.ipintelligence.engine.onpremise.interop.swig -module IpIntelligenceOnPremiseEngineModule -outdir ../java/fiftyone/ipintelligence/engine/onpremise/interop/swig -o Java_Ipi_Engine.cpp hash_java.i
          set +x

      - name: Record the changes
        id: record
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          git add -A -- cxx "$DD_CXX/Java_Hash_Engine.cpp" "$DD_SWIG" "$IPI_CXX/Java_Ipi_Engine.cpp" "$IPI_SWIG"
          git status --short --untracked-files=all
          { git diff --cached --name-only --no-renames; git diff --name-only --no-renames; git ls-files --others --exclude-standard; } | sort -u > "$OUT/changed-paths.txt"
          esc() { printf '%s' "$1" | sed 's/[.]/\\./g'; }
          allowed="^(cxx|$(esc "$DD_CXX")/Java_Hash_Engine\.cpp|$(esc "$DD_SWIG")/[^/]+\.java|$(esc "$IPI_CXX")/Java_Ipi_Engine\.cpp|$(esc "$IPI_SWIG")/[^/]+\.java)$"
          grep -v -E "$allowed" "$OUT/changed-paths.txt" > "$OUT/unexpected-paths.txt" || true
          if [ -s "$OUT/unexpected-paths.txt" ]; then unexpected=true; else unexpected=false; fi
          echo "Unexpected changes:"; cat "$OUT/unexpected-paths.txt"
          echo "unexpected=$unexpected" >> "$GITHUB_OUTPUT"

          git diff --cached --no-renames --name-status > "$OUT/regenerated-4e023aaa-name-status.txt"
          git diff --cached --no-renames --stat=300 > "$OUT/regenerated-4e023aaa-stat.txt"
          git diff --cached --no-renames > "$OUT/regenerated-4e023aaa.diff"
          cat "$OUT/regenerated-4e023aaa-name-status.txt"
          cat "$OUT/regenerated-4e023aaa-stat.txt"

          REGEN="$OUT/generated-4e023aaa"
          mkdir -p "$REGEN/$DD_CXX" "$REGEN/$IPI_CXX" "$REGEN/$DD_SWIG" "$REGEN/$IPI_SWIG"
          cp "$DD_CXX/Java_Hash_Engine.cpp" "$REGEN/$DD_CXX/"
          cp "$IPI_CXX/Java_Ipi_Engine.cpp" "$REGEN/$IPI_CXX/"
          cp "$DD_SWIG"/*.java "$REGEN/$DD_SWIG/"
          cp "$IPI_SWIG"/*.java "$REGEN/$IPI_SWIG/"
          {
            echo "### Generated with cxx at $CXX_TARGET"
            echo
            echo '```'
            cat "$OUT/regenerated-4e023aaa-name-status.txt"
            echo '```'
            echo "Unexpected changes: unexpected=$unexpected"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the outputs and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swig-wrappers
          path: ${{ runner.temp }}/out
          if-no-files-found: error

      - name: Commit and push
        if: steps.reproduce.outputs.identical == 'true' && steps.check.outputs.foreign == 'false' && steps.record.outputs.unexpected == 'false'
        env:
          GIT_AUTHOR_NAME: James Rosewell
          GIT_AUTHOR_EMAIL: james@51degrees.com
          GIT_COMMITTER_NAME: James Rosewell
          GIT_COMMITTER_EMAIL: james@51degrees.com
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/message.txt" <<'EOF'
          Generate the SWIG wrappers again for 51degrees-cxx 4.5.101

          51degrees-cxx 4.5.101 removes the process overloads of EngineHash and
          EngineIpi that take required property indexes. The committed wrappers
          still call them, so the native libraries would not compile once cxx
          moves to that release.

          This moves cxx to 4e023aaa5c1f5ec56d475c75a91761d8ef55dc20, the head of
          the 4.5.101 release pull request in 51degrees-cxx, and generates both
          wrappers again from its interfaces with SWIG 4.5.1. Device Detection
          uses the RebuildSwig command in its CMakeLists.txt and IP Intelligence
          uses the command in its RegenSwig.ps1. With cxx at
          4110d6813e167a803a06489318b33b83a230fa32 the same commands give the
          committed wrappers byte for byte.
          EOF
          git commit -q -F "$RUNNER_TEMP/message.txt"
          git log -1 --format='commit %H%nauthor %an <%ae>%ncommitter %cn <%ce>%n%n%B'
          git show --stat=300 --format= HEAD
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "Pushed $(git rev-parse HEAD) to $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop when a check did not pass
        if: steps.reproduce.outputs.identical != 'true' || steps.check.outputs.foreign != 'false' || steps.record.outputs.unexpected != 'false'
        run: |
          echo "identical=${{ steps.reproduce.outputs.identical }} foreign=${{ steps.check.outputs.foreign }} unexpected=${{ steps.record.outputs.unexpected }}"
          echo "Nothing was committed."
          exit 1
