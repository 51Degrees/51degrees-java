name: Temporary typed read timing

on:
  push:
    branches:
      - 'tmp/index-java-timing**'

permissions:
  contents: read

jobs:
  time:
    name: Typed read before and after
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout common-ci at the root, as the shared workflows do
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/common-ci
      - name: Checkout the change
        uses: actions/checkout@v4
        with:
          path: after
          submodules: recursive
      - name: Checkout the commit before the change
        uses: actions/checkout@v4
        with:
          path: before
          ref: 4a5c3bfd06afbce7b570963b459664513c1b1eef
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Fetch the data files
        shell: pwsh
        run: |
          ./after/ci/fetch-assets.ps1 `
            -DeviceDetection '${{ secrets.DEVICE_DETECTION_KEY }}' `
            -DeviceDetectionUrl '${{ secrets.DEVICE_DETECTION_URL }}' `
            -IpIntelligence '${{ secrets.IP_INTELLIGENCE_KEY }}' `
            -IpIntelligenceUrl '${{ secrets.IPI_DATA_FILE_URL }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType SymbolicLink -Force -Target "$PWD/assets/51Degrees-LiteV4.1.hash" -Path "before/cxx/data/device-detection/51Degrees-LiteV4.1.hash"
          $test = 'device-detection/device-detection.hash.engine.on-premise/src/test/java/fiftyone/devicedetection/hash/engine/onpremise/flowelements/TypedReadTiming.java'
          Copy-Item "after/$test" "before/$test"
      - name: Build both
        shell: pwsh
        run: |
          foreach ($dir in 'before', 'after') {
            Push-Location $dir
            git log --oneline -1
            mvn -B -q install -DskipTests -Pdev
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Pop-Location
          }
      - name: Time the typed read, alternating before and after
        shell: pwsh
        run: |
          foreach ($round in 1..3) {
            foreach ($dir in 'before', 'after') {
              Push-Location $dir
              mvn -B -f device-detection/pom.xml -pl device-detection.hash.engine.on-premise test `
                '-Dtest=TypedReadTiming' '-DfailIfNoTests=false' `
                '-Dsurefire.failIfNoSpecifiedTests=false' | Select-String 'TYPED COST|Tests run:|BUILD'
              Pop-Location
            }
          }
