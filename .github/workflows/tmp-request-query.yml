name: tmp request query tests
on:
  push:
    branches:
      - 'tmp/java-query-red'
      - 'tmp/java-query-green'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch the pipeline submodules
        run: git submodule update --init --depth 1 pipeline/owid-java pipeline/pipeline.core/configuration-validation pipeline/pipeline.javascriptbuilder/src/main/resources/fiftyone/pipeline/javascriptbuilder/templates
      - name: Java and Maven on the runner
        run: |
          git log --oneline -3
          java -version
      - name: Run the web integration tests
        run: >
          mvn -B --no-transfer-progress -Pdev
          -pl pipeline/pipeline.web.packages/pipeline.web -am test
          -Dtest='RequestLineEvidenceTests,UsageSharingEvidenceTests,PipelineFilterTests'
          -Dsurefire.failIfNoSpecifiedTests=false
