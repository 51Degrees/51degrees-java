name: Monthly Copyright Update

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
  schedule:
    # The copyright year only changes once a year, so this runs on 1 January.
    - cron: '0 0 1 1 *'

jobs:
  Monthly_Copyright_Update:
    uses: 51Degrees/common-ci/.github/workflows/monthly-copyright-update.yml@19be8a0e3a6c6c3da2c4bbcde585d2df1df186c7
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
    secrets: inherit
