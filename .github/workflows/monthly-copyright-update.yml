name: Monthly Copyright Update

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
  # Off until this repository takes over from the separate Java repositories
  # it replaces. Their schedules are turned off then, so the same jobs never
  # run in both.
  # schedule:
  #   # * is a special character in YAML so quote this string
  #   - cron: '0 0 1 * *'

jobs:
  Monthly_Copyright_Update:
    uses: 51Degrees/common-ci/.github/workflows/monthly-copyright-update.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
