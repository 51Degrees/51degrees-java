name: Publish

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      common-ci-ref:
        type: string
        default: ''

jobs:
  Publish:
    name: Publish
    uses: 51Degrees/common-ci/.github/workflows/nightly-publish.yml@19be8a0e3a6c6c3da2c4bbcde585d2df1df186c7
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
      cache-assets: true
    secrets: inherit
