name: Temporary step 5 tests

on:
  push:
    branches:
      - 'tmp/step5c-java-**'

permissions:
  contents: read

jobs:
  test:
    name: Step 5 tests, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['8', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the submodules the modules build from
        shell: pwsh
        run: |
          git submodule update --init pipeline/pipeline.javascriptbuilder/src/main/resources/fiftyone/pipeline/javascriptbuilder/templates pipeline/owid-java
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - name: Run the step 5 tests
        shell: pwsh
        run: |
          git log --oneline -1
          mvn -B -f pipeline/pom.xml -pl pipeline.engines.fiftyone,pipeline.javascriptbuilder -am test `
            '-Dtest=SessionIdAndSequenceTests,SequenceElementTests,JavaScriptBuilderTests' `
            '-DfailIfNoTests=false' '-Dsurefire.failIfNoSpecifiedTests=false'
          if ($LASTEXITCODE -ne 0) { exit 1 }
