name: Only rc into main

# A pull request into the default branch must come from rc. This repository
# publishes packages to Maven Central, so a release from rc into main also
# has to come at least a week after the last one, unless it carries the
# early-release label. See 51Degrees/common-ci
# .github/workflows/only-rc-into-main.yml.
on:
  pull_request:

jobs:
  rc:
    name: Only rc into main
    # The shared check reads the pull request and its labels.
    permissions:
      contents: read
      pull-requests: read
    uses: 51Degrees/common-ci/.github/workflows/only-rc-into-main.yml@main
    with:
      publishes-packages: true
