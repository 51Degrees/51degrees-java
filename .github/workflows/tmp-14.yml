name: tmp 14 tests
on: push
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Java and Maven on the runner
        run: |
          java -version
          mvn -v
      - name: Run the builder default tests
        run: >
          mvn -B --no-transfer-progress
          -pl pipeline/pipeline.core,pipeline/pipeline.engines,pipeline/pipeline.engines.fiftyone -am test -fae
          -Dtest='PipelineBuilderBaseTests,PrePackagedPipelineBuilderBaseTests,FiftyOnePipelineBuilderTests'
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dmaven.test.failure.ignore=true
      - name: List the test results
        run: |
          for f in $(find . -path '*surefire-reports*' -name 'TEST-*.xml'); do
            grep -o '<testsuite [^>]*' "$f" | grep -o -E '(name|tests|failures|errors|skipped)="[^"]*"' | tr '\n' ' '; echo
          done
          files=$(grep -l -E '<(failure|error)[ >]' -r --include='TEST-*.xml' . || true)
          if [ -n "$files" ]; then
            for f in $files; do
              echo "== $f"
              grep -B1 -A3 -E '<(failure|error)[ >]' "$f" | cut -c1-400 | head -40
            done
            exit 1
          fi
          echo "No failing tests"
