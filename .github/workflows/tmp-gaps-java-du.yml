name: Temporary data update tests

on:
  push:
    branches:
      - 'tmp/gaps-java-du-**'

permissions:
  contents: read

jobs:
  test:
    name: Data update tests, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the submodules the modules build from
        shell: pwsh
        run: |
          git submodule update --init pipeline/pipeline.javascriptbuilder/src/main/resources/fiftyone/pipeline/javascriptbuilder/templates pipeline/owid-java
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Run the data update tests
        shell: pwsh
        run: |
          git log --oneline -1
          mvn -B -f pipeline/pom.xml -pl pipeline.engines,pipeline.engines.fiftyone -am test `
            '-Dtest=DataUpdateServiceLoggingTests,DataUpdateServiceTests,FiftyOneDegreesOnPremiseAspectEngineBuilderBaseTests' `
            '-Dmaven.test.failure.ignore=true' '-DfailIfNoTests=false' '-Dsurefire.failIfNoSpecifiedTests=false'
          if ($LASTEXITCODE -ne 0) { exit 1 }
