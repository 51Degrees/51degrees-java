name: CI script tests

# Runs the Pester tests of the scripts in ci on Linux and Windows, where the
# builds run them. The environment variable names workflow runs its own test.

on:
  pull_request:
    paths:
      - 'ci/**'
      - '.github/workflows/ci-script-tests.yml'
  push:
    branches:
      - main
      - rc
    paths:
      - 'ci/**'
      - '.github/workflows/ci-script-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-script-tests:
    name: Test the CI scripts on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run the tests
        shell: pwsh
        run: |
          $tests = Get-ChildItem ./ci -Filter *.Tests.ps1 |
            Where-Object Name -ne 'check-environment-variable-names.Tests.ps1'
          Invoke-Pester -Path $tests.FullName -CI -Output Detailed
