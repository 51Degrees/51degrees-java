name: tmp cloud examples without a key
on:
  push:
    branches:
      - 'tmp/java-cloud-nokey-red'
      - 'tmp/java-cloud-nokey-green'
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: device-detection
            run: mvn -B --no-transfer-progress -f examples/device-detection/pom.xml -pl console,web/getting-started.cloud -am test -Dtest=CloudExamplesWithoutKeyTest,GettingStartedWebCloudWithoutKeyTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.test.failure.ignore=true
          - part: ip-intelligence
            run: mvn -B --no-transfer-progress -f examples/ip-intelligence/pom.xml -pl console,web/getting-started.cloud,web/getting-started.cloud.mixed -am test -Dtest=CloudExamplesWithoutKeyTest,GettingStartedWebCloudWithoutKeyTest,GettingStartedWebCloudMixedWithoutKeyTest -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.test.failure.ignore=true
          - part: location
            run: mvn -B --no-transfer-progress -Pdev -pl location/geo-location.shell.examples -am test -Dtest=CloudExamplesWithoutKeyTests -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.test.failure.ignore=true
          - part: fodid
            run: mvn -B --no-transfer-progress -Pdev -pl pipeline/pipeline.developer-examples/pipeline.developer-examples.fodid -am test -Dtest=CreatorContextDemoServerWithoutKeyTests -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dmaven.test.failure.ignore=true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch the pipeline submodules
        run: git submodule update --init --depth 1 pipeline/owid-java pipeline/pipeline.core/configuration-validation pipeline/pipeline.javascriptbuilder/src/main/resources/fiftyone/pipeline/javascriptbuilder/templates
      - name: Java and Maven on the runner
        run: |
          git log --oneline -3
          java -version
          env | cut -d= -f1 | grep -i key || echo "No variable name holds KEY"
      - name: Run the tests
        run: ${{ matrix.run }}
      - name: List the test results
        if: always()
        run: |
          for f in $(find . -path '*surefire-reports*' -name 'TEST-*.xml'); do
            grep -o '<testsuite [^>]*' "$f" | grep -o -E '(name|tests|failures|errors|skipped)="[^"]*"' | tr '\n' ' '; echo
          done
          for f in $(find . -path '*surefire-reports*' -name '*-output.txt'); do
            echo "== $f"; head -c 3000 "$f"; echo
          done
          files=$(grep -l -E '<(failure|error)[ >]' -r --include='TEST-*.xml' . || true)
          if [ -n "$files" ]; then
            for f in $files; do
              echo "== $f"
              grep -A6 -E '<(failure|error)[ >]' "$f" | cut -c1-300 | head -24
            done
            exit 1
          fi
          echo "No failing tests"
