name: tmp 12 probe 2
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      LK: ${{ secrets._51DEGREES_LICENSE_KEY_51DID }}
      BASE: https://cloud.51degrees.com/api/v4
      UA: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/98.0.4758.102 Safari/537.36"
    steps:
      # Only the status and the names of the fields are printed, with the
      # number of messages in any list, so that no key and no value from an
      # answer reaches the log.
      - name: Accessible properties under the 51Did license key alone
        run: |
          code=$(curl -s -o out.json -w '%{http_code}' -X POST \
            --data-urlencode "license=$LK" "$BASE/accessibleproperties")
          echo "status $code"
          jq -r '.Products // {} | to_entries[] | "product \(.key | length) letters, \(.value.Properties | length) properties"' out.json 2>/dev/null
          rm -f out.json
      - name: Data requests under the 51Did license key alone
        run: |
          ask() {
            echo "== values=$1"
            code=$(curl -s -o out.json -w '%{http_code}' -X POST \
              --data-urlencode "license=$LK" \
              --data-urlencode "values=$1" \
              --data-urlencode "header.user-agent=$UA" \
              --data-urlencode "query.client-ip=8.8.8.8" "$BASE/json")
            echo "status $code"
            jq -c 'to_entries | map({(.key): (.value | if type == "object" then keys elif type == "array" then "\(length) messages" else type end)}) | add' out.json 2>/dev/null \
              | sed -E 's/[A-Za-z0-9+\/=_-]{24,}/<long>/g' | cut -c1-600
            rm -f out.json
          }
          ask "device.ismobile"
          ask "device.notaproperty51d"
          ask "FODiD.IdProbGlobal"
          ask "FODiD.IdProbGlobal,device.ismobile"
          ask "FODiD.IdProbGlobal,device.ismobile,device.notaproperty51d"
