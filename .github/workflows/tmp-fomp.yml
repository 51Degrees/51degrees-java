name: tmp find out more pipeline tests
on:
  push:
    branches:
      - 'tmp/java-fomp-red'
      - 'tmp/java-fomp-green'
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java and Maven on the runner
        run: |
          git log --oneline -3
          java -version
          mvn -v
      - name: Run the developer example tests
        env:
          _51DEGREES_RESOURCE_KEY: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
        run: >
          mvn -B --no-transfer-progress -Pdev
          -pl pipeline/pipeline.developer-examples/pipeline.developer-examples.flowelement,pipeline/pipeline.developer-examples/pipeline.developer-examples.onpremise-engine,pipeline/pipeline.developer-examples/pipeline.developer-examples.cloud-engine,pipeline/pipeline.developer-examples/pipeline.developer-examples.usage-sharing,pipeline/pipeline.developer-examples/pipeline.developer-examples.fodid
          -am test
          -Dtest='FindOutMoreTests,ExampleTests'
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dmaven.test.failure.ignore=true
      - name: List the test results
        run: |
          for f in $(find . -path '*surefire-reports*' -name 'TEST-*.xml'); do
            grep -o '<testsuite [^>]*' "$f" | grep -o -E '(name|tests|failures|errors|skipped)="[^"]*"' | tr '\n' ' '; echo
          done
          files=$(grep -l -E '<(failure|error)[ >]' -r --include='TEST-*.xml' . || true)
          if [ -n "$files" ]; then
            for f in $files; do
              echo "== $f"
              grep -A6 -E '<(failure|error)[ >]' "$f" | cut -c1-300 | head -24
            done
            exit 1
          fi
          echo "No failing tests"
