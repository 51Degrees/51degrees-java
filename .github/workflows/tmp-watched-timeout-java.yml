name: Temporary watched file timeout tests

on:
  push:
    branches:
      - 'tmp/watched-timeout-java-**'

permissions:
  contents: read

jobs:
  test:
    name: Watched file tests, ${{ matrix.os }}, Java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['8', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - name: Run the data update service tests
        shell: pwsh
        run: |
          git log --oneline -1
          mvn -B -f pipeline/pom.xml -pl pipeline.engines -am test `
            '-Dtest=DataUpdateService*' `
            '-DfailIfNoTests=false' '-Dsurefire.failIfNoSpecifiedTests=false'
          if ($LASTEXITCODE -ne 0) { exit 1 }
