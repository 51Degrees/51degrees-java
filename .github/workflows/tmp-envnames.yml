name: Temporary environment variable name guard

on:
  push:
    branches:
      - 'tmp/envnames-**'

permissions:
  contents: read

jobs:
  test:
    name: Environment variable name guard, ${{ matrix.os }} java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ['8', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '${{ matrix.java }}'
          cache: maven
      - name: Run the guard test
        shell: pwsh
        run: |
          git log --oneline -1
          mvn -B -f pipeline/pom.xml -pl pipeline.common test `
            '-Dtest=EnvironmentVariableNamesTest' `
            '-DfailIfNoTests=false' '-Dsurefire.failIfNoSpecifiedTests=false'
          if ($LASTEXITCODE -ne 0) { exit 1 }
