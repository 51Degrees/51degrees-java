name: Examples from a fresh clone

# Temporary red: the other systems' job without the step that restores the
# data file, so its example downloads the file again and the run step's
# check fails. Device Detection only, as its file is the small one.

on:
  push:
    branches:
      - 'tmp/java-fresh-once-red'

permissions:
  contents: read

jobs:
  download:
    name: ${{ matrix.product }} on ubuntu-latest, downloading its data file
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: device-detection
            example: fiftyone.devicedetection.examples.console.GettingStartedOnPrem
            file: cxx/data/device-detection/51Degrees-LiteV4.1.hash
    runs-on: ubuntu-latest
    steps:
      - name: Clone the repository with its submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build the console examples against the published packages
        working-directory: examples/${{ matrix.product }}
        shell: pwsh
        run: mvn -B --no-transfer-progress -pl console -am package -DskipTests

      - name: Run the getting started example from the repository root
        shell: pwsh
        run: >-
          ./ci/run-fresh-clone-example.ps1 -Product '${{ matrix.product }}'
          -Example '${{ matrix.example }}' -ExpectDownload $true

  other-systems:
    name: ${{ matrix.product }} on ${{ matrix.os }}
    needs: download
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        product: [device-detection]
        include:
          - product: device-detection
            example: fiftyone.devicedetection.examples.console.GettingStartedOnPrem
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone the repository with its submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build the console examples against the published packages
        working-directory: examples/${{ matrix.product }}
        shell: pwsh
        run: mvn -B --no-transfer-progress -pl console -am package -DskipTests

      - name: Run the getting started example from the repository root
        shell: pwsh
        run: >-
          ./ci/run-fresh-clone-example.ps1 -Product '${{ matrix.product }}'
          -Example '${{ matrix.example }}' -ExpectDownload $false
