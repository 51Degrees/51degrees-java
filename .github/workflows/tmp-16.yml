name: tmp usage builder tests
on: push
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Java and Maven on the runner
        run: |
          java -version
          mvn -v
      - name: Run the usage sharing tests
        run: >
          mvn -B --no-transfer-progress
          -pl pipeline/pipeline.engines.fiftyone -am test
          -Dtest=ShareUsageBuilderBaseTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dmaven.test.failure.ignore=true
      - name: List the test results
        run: |
          for f in $(find . -path '*surefire-reports*' -name 'TEST-*.xml'); do
            grep -o '<testsuite [^>]*' "$f" | grep -o -E '(name|tests|failures|errors|skipped)="[^"]*"' | tr '\n' ' '; echo
          done
          files=$(grep -l -E '<(failure|error)[ >]' -r --include='TEST-*.xml' . || true)
          if [ -n "$files" ]; then
            for f in $files; do
              echo "== $f"
              grep -B1 -A3 -E '<(failure|error)[ >]' "$f" | cut -c1-400 | head -40
            done
            exit 1
          fi
          echo "No failing tests"
      - name: The class ran
        run: |
          n=$(find . -path '*surefire-reports*' -name 'TEST-*ShareUsageBuilderBaseTest.xml' | wc -l)
          [ "$n" -eq 1 ] || { echo "ShareUsageBuilderBaseTest did not run"; exit 1; }
          echo "ShareUsageBuilderBaseTest ran"
