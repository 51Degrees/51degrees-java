name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test (pipeline/pipeline.did,
# DidClientLiveTests) once for every _51DEGREES_RESOURCE_KEY* key passed in
# below. Each run sets the single _51DEGREES_RESOURCE_KEY the test reads.
# Only keys that carry the fodid product are passed in, because the tests ask
# the cloud for a 51Did and fail, saying so, when a key gets an answer with no
# identifier in it. That is entitlement working rather than a fault.
#
# A run that has a license key also runs the Cloud Request Engine's live test
# on a license key alone (pipeline/pipeline.cloudrequestengine,
# CloudRequestEngineLiveTests), because no other workflow has a license key
# for the cloud service. Without one that test skips.
#
# The secrets are named one by one rather than passed as toJSON(secrets).
# GitHub marks a workflow that hands every secret to a step as possibly
# malicious and holds each run for manual approval, so the nightly never ran.
# A new resource key therefore needs a line here as well as the organisation
# secret.
#
# A run with no key available fails. A cloud test that passes without
# calling the cloud reports success having proved nothing, and that is worse
# than a red job. A pull request from a fork gets no secrets, so run this
# workflow from a branch in this repository.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. That is what happened when the cloud service began
  # writing the Terms byte. The six 51Did packages are
  # staggered ten minutes apart so they do not all ask production at once.
  schedule:
    - cron: '10 5 * * *'
  pull_request:
    branches: [main, rc]
    paths:
      - 'pipeline/pipeline.did/**'
      - 'pipeline/pipeline.cloudrequestengine/**'
      - 'pipeline/owid-java/**'
      - '.github/workflows/cloud-51did.yml'

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pipeline.did builds against the owid-java submodule source.
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          # The reactor targets 1.8, so the tests are compiled and run on a
          # toolchain that can still produce it.
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Cloud 51Did test for each resource key secret
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY_BESPOKE: ${{ secrets._51DEGREES_RESOURCE_KEY_BESPOKE }}
          _51DEGREES_RESOURCE_KEY_51DID: ${{ vars._51DEGREES_RESOURCE_KEY_51DID }}
          # Without a license key the tests that redeem a sealed verdict skip.
          # The service only redeems with a license key of the resource key's
          # own account, so each one is paired by suffix with the resource
          # key it belongs to.
          _51DEGREES_LICENSE_KEY_51DID: ${{ secrets._51DEGREES_LICENSE_KEY_51DID }}
        run: |
          $keys = Get-ChildItem env: |
            Where-Object { $_.Name -like '_51DEGREES_RESOURCE_KEY*' -and $_.Value }
          if (-not $keys) {
            throw ('No _51DEGREES_RESOURCE_KEY* secret is available, so the ' +
              'live 51Did tests cannot call the cloud service. The keys ' +
              'carry the fodid product these tests need. A pull request ' +
              'from a fork gets no secrets, so run this workflow from a ' +
              'branch in this repository.')
          }
          $failed = $false
          foreach ($k in $keys) {
            Write-Host "::group::Live tests with $($k.Name)"
            $env:_51DEGREES_RESOURCE_KEY = $k.Value
            $licenseName = $k.Name -replace '^_51DEGREES_RESOURCE_KEY', '_51DEGREES_LICENSE_KEY'
            $license = [Environment]::GetEnvironmentVariable($licenseName)
            if ($license) {
              Write-Host "License key: $licenseName"
              $env:_51DEGREES_LICENSE_KEY = $license
            } else {
              Write-Host 'License key: none'
              Remove-Item Env:_51DEGREES_LICENSE_KEY -ErrorAction SilentlyContinue
            }
            # Only the Pipeline API tree is built, as in its own repository.
            mvn -B -f pipeline/pom.xml `
              -pl pipeline.did,pipeline.cloudrequestengine -am test `
              '-Dtest=DidClientLiveTests,CloudRequestEngineLiveTests#build_Process_LicenseKeyAlone*' `
              -DfailIfNoTests=false
            if ($LASTEXITCODE -ne 0) { $failed = $true }
            Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }
