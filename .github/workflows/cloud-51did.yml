name: Cloud 51Did Tests

# Runs the live cloud 51Did integration test (pipeline/pipeline.did,
# DidClientLiveTests) once for each resource key the test names, which is the
# 51Did key with the 51Did license key and the Bespoke key with no license
# key. The test reads each key under its own name. Only keys that carry the
# fodid product are used, because the tests ask the cloud for a 51Did and
# fail, saying so, when a key gets an answer with no identifier in it. That
# is entitlement working rather than a fault.
#
# The run also makes the Cloud Request Engine's live test on a license key
# alone (pipeline/pipeline.cloudrequestengine, CloudRequestEngineLiveTests),
# with the cloud license in _51DEGREES_LICENSE_KEY_BESPOKE. Without one that
# test skips. _51DEGREES_LICENSE_KEY holds the license for the data files, so
# it is not set here.
#
# The keys are named one by one. The resource keys are organization
# variables and the license keys are organization secrets, so a new resource
# key needs a line here and in the test as well as the organization variable,
# and a new license key a line here as well as the organization secret.
#
# The tests call the cloud service that the organization variable
# _51DEGREES_CLOUD_ENDPOINT names, and the public service when it names none.
#
# A run with no key available fails. A cloud test that passes without
# calling the cloud reports success having proved nothing, and that is worse
# than a red job. A pull request from a fork gets no secrets, so run this
# workflow from a branch in this repository.

on:
  workflow_dispatch:
  # Nightly as well, because a pull_request run only ever checks the package
  # against the cloud as it stood that day. A released package is not checked
  # again, so a field the cloud starts writing, stops writing or changes goes
  # unnoticed until a customer finds it. That is what happened when the cloud service began
  # writing the Terms byte. The six 51Did packages are
  # staggered ten minutes apart so they do not all call the cloud service at once.
  schedule:
    - cron: '10 5 * * *'
  pull_request:
    branches: [main, rc]
    paths:
      - 'pipeline/pipeline.did/**'
      - 'pipeline/pipeline.cloudrequestengine/**'
      - 'pipeline/owid-java/**'
      - '.github/workflows/cloud-51did.yml'

jobs:
  cloud-51did:
    name: Cloud 51Did
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # pipeline.did builds against the owid-java submodule source.
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          # The reactor targets 1.8, so the tests are compiled and run on a
          # toolchain that can still produce it.
          distribution: temurin
          java-version: '8'
          cache: maven
      - name: Cloud 51Did tests
        shell: pwsh
        env:
          _51DEGREES_RESOURCE_KEY_51DID: ${{ vars._51DEGREES_RESOURCE_KEY_51DID }}
          # Without a license key the tests that redeem a sealed verdict skip.
          # The service only redeems with a license key of the resource key's
          # own account, so the tests use this one with the 51Did resource
          # key only.
          _51DEGREES_LICENSE_KEY_51DID: ${{ secrets._51DEGREES_LICENSE_KEY_51DID }}
          _51DEGREES_RESOURCE_KEY_BESPOKE: ${{ vars._51DEGREES_RESOURCE_KEY_BESPOKE }}
          # The license for the cloud products, for the test on a license key
          # alone.
          _51DEGREES_LICENSE_KEY_BESPOKE: ${{ secrets._51DEGREES_LICENSE_KEY_BESPOKE }}
          _51DEGREES_CLOUD_ENDPOINT: ${{ vars._51DEGREES_CLOUD_ENDPOINT }}
        run: |
          # A license key whose resource key of the same account is empty
          # means that organization variable is missing. Its licensed tests
          # would then never run, and the job would still pass, so it fails
          # here, naming it.
          $missing = @(
            @{ Resource = '_51DEGREES_RESOURCE_KEY_51DID'; License = '_51DEGREES_LICENSE_KEY_51DID' }
            @{ Resource = '_51DEGREES_RESOURCE_KEY_BESPOKE'; License = '_51DEGREES_LICENSE_KEY_BESPOKE' }
          ) | Where-Object {
            [Environment]::GetEnvironmentVariable($_.License) -and
              -not [Environment]::GetEnvironmentVariable($_.Resource)
          } | ForEach-Object { $_.Resource }
          if ($missing) {
            throw ("The organization variable $($missing -join ', ') is " +
              'empty or missing, but the license key of the same account is ' +
              'set. Add the organization variable, a resource key of the ' +
              'same account as that license key.')
          }
          if (-not $env:_51DEGREES_RESOURCE_KEY_51DID -and
              -not $env:_51DEGREES_RESOURCE_KEY_BESPOKE) {
            throw ('No resource key variable is available, so the live 51Did ' +
              'tests cannot call the cloud service. The keys carry the ' +
              'fodid product these tests need. A pull request from a fork ' +
              'gets no secrets, so run this workflow from a branch in this ' +
              'repository.')
          }
          # Only the Pipeline API tree is built, as in its own repository.
          mvn -B -f pipeline/pom.xml `
            -pl pipeline.did,pipeline.cloudrequestengine -am test `
            '-Dtest=DidClientLiveTests,CloudRequestEngineLiveTests#build_Process_LicenseKeyAlone*' `
            -DfailIfNoTests=false
          if ($LASTEXITCODE -ne 0) { exit 1 }
