name: Temporary red run, no Evidence adder in a parallel group, the head with the refusal taken out

# Throwaway. Runs the new parallel group test at the test commit before the fix
# (expected to fail) and at the fix (expected to pass).

on:
  push:
    branches:
      - 'tmp/red-parallel2'

permissions:
  contents: read

jobs:
  run:
    name: ${{ matrix.side }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - side: red, the head with the refusal taken out
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the submodules the module builds from
        run: >
          git submodule update --init
          pipeline/pipeline.javascriptbuilder/src/main/resources/fiftyone/pipeline/javascriptbuilder/templates
          pipeline/owid-java pipeline/pipeline.core/configuration-validation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build the module and what it needs
        run: mvn -B -pl pipeline/pipeline.engines.fiftyone -am install -DskipTests
      - name: Run the new test in the module alone
        run: |
          git log --oneline -1
          mvn -B -pl pipeline/pipeline.engines.fiftyone surefire:test -Dtest=SequenceElementParallelTests -Dsurefire.failIfNoSpecifiedTests=false -DtrimStackTrace=false
