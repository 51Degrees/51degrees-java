name: Temporary property index cost

on:
  push:
    branches:
      - 'tmp/index-java-cost-**'

permissions:
  contents: read

jobs:
  measure:
    name: Property index cost
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout common-ci at the root, as the shared workflows do
        uses: actions/checkout@v4
        with:
          repository: 51Degrees/common-ci
      - name: Checkout this repository beside it
        uses: actions/checkout@v4
        with:
          path: 51degrees-java
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Fetch the data files
        shell: pwsh
        run: |
          ./51degrees-java/ci/fetch-assets.ps1 `
            -DeviceDetection '${{ secrets.DEVICE_DETECTION_KEY }}' `
            -DeviceDetectionUrl '${{ secrets.DEVICE_DETECTION_URL }}' `
            -IpIntelligence '${{ secrets.IP_INTELLIGENCE_KEY }}' `
            -IpIntelligenceUrl '${{ secrets.IPI_DATA_FILE_URL }}'
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build the reactor without tests
        shell: pwsh
        run: |
          Push-Location 51degrees-java
          git log --oneline -1
          mvn -B install -DskipTests -Pdev
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Measure
        shell: pwsh
        run: |
          Push-Location 51degrees-java
          $ua = (Resolve-Path 'cxx/data/device-detection/20000 User Agents.csv').Path
          foreach ($case in @(
            @{ File = 'cxx/data/device-detection/TAC-HashV41.hash'; Label = 'TAC' },
            @{ File = 'cxx/data/device-detection/51Degrees-LiteV4.1.hash'; Label = 'Lite' })) {
            $path = (Resolve-Path $case.File).Path
            foreach ($profile in 'MaxPerformance', 'LowMemory') {
              mvn -B -f device-detection/pom.xml -pl device-detection.hash.engine.on-premise test `
                '-Dtest=IndexCostTiming' '-DfailIfNoTests=false' `
                '-Dsurefire.failIfNoSpecifiedTests=false' `
                "-DcostDataFile=$path" "-DcostUaFile=$ua" `
                "-DcostProfile=$profile" "-DcostLabel=$($case.Label)"
              if ($LASTEXITCODE -ne 0) { exit 1 }
            }
          }
