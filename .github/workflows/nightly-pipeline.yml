name: Nightly Pipeline

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      common-ci-ref:
        type: string
        default: ''
  schedule:
    - cron: '0 3 * * *'

jobs:
  # The publish builds main, which the pull requests into rc do not change, so
  # it runs first and has the runners before the pull request builds do.
  Publish:
    name: Nightly Publish
    uses: 51Degrees/common-ci/.github/workflows/nightly-publish.yml@19be8a0e3a6c6c3da2c4bbcde585d2df1df186c7
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
      cache-assets: true
    secrets: inherit

  DataFileChange:
    name: Nightly Data File Change
    uses: 51Degrees/common-ci/.github/workflows/nightly-data-file-change.yml@19be8a0e3a6c6c3da2c4bbcde585d2df1df186c7
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
    secrets: inherit

  PackageUpdate:
    name: Nightly Package Update
    uses: 51Degrees/common-ci/.github/workflows/nightly-package-update.yml@19be8a0e3a6c6c3da2c4bbcde585d2df1df186c7
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
    secrets: inherit

  SubmoduleUpdate:
    name: Nightly Submodule Update
    uses: 51Degrees/common-ci/.github/workflows/nightly-submodule-update.yml@19be8a0e3a6c6c3da2c4bbcde585d2df1df186c7
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
    secrets: inherit

  PullRequests:
    if: ${{ !cancelled() }}
    needs: [Publish, DataFileChange, PackageUpdate, SubmoduleUpdate]
    name: Nightly Pull Requests
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-requests.yml@19be8a0e3a6c6c3da2c4bbcde585d2df1df186c7
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
      cache-assets: true
      # One configuration that fails does not cancel the others.
      fail-fast: false
    secrets: inherit
