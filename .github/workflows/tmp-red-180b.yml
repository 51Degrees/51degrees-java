name: Temporary red run for pull request 180

# Throwaway. The head of pull request 180 with its fix taken out, so the
# wait for the data to be sent is the whole close limit again rather than
# the limit less the reserve. The close time test is expected to fail on
# every runner.

on:
  push:
    branches:
      - 'tmp/red-180b'

permissions:
  contents: read

jobs:
  red:
    name: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-22.04, ubuntu-22.04-arm, windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: The submodules the module needs
        shell: bash
        run: git submodule update --init pipeline/pipeline.javascriptbuilder/src/main/resources/fiftyone/pipeline/javascriptbuilder/templates pipeline/owid-java pipeline/pipeline.core/configuration-validation
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build the module and the modules it needs
        shell: bash
        run: mvn -B -q -pl pipeline/pipeline.engines.fiftyone -am install -DskipTests
      - name: Run the close time tests
        shell: bash
        run: mvn -B -pl pipeline/pipeline.engines.fiftyone surefire:test -Dtest=ShareUsageCloseTimeoutTests -DtrimStackTrace=false
