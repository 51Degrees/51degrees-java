# FrostRisk
#
# An example script for the Derived Property Element, read from this file
# by the example beside it. It answers true where the reading is at or
# below 2 degrees and the air is damp, which is when frost forms.
#
# Each check is true or false. The aggregate counts the checks that failed,
# so a reading that passes both is a frost risk. The last rule is an Else,
# so the script always gives a value once both readings are available.

Format: 1
Name: FrostRisk
Version: "1.0.0"
Output:
  Name: FrostRisk
  Description: True where the temperature and the humidity are those at which frost forms.
  ValueType: bool
  IsList: false
  Category: Weather
Checks:
  Freezing: { Property: sensor.Temperature, Le: 2 }
  Damp: { Property: sensor.Humidity, Ge: 80 }
Rules:
  - When: { Failed: Checks, Eq: 0 }
    Then: true
  - Else: false
